<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콕패스 관리자</title>
<style>
  :root{
    --bg:#f5f4f1; --card:#ffffff; --border:rgba(20,20,20,.10);
    --text:#1c1c1e; --text2:#6b6b6f; --text3:#9b9b9f;
    --gold:#b8912f; --gold-dark:#8f701f; --navy:#12203a; --navy2:#1b3054;
    --green:#0f9d68; --amber:#b56a00; --red:#dc3545; --blue:#2f6fe0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Pretendard","-apple-system",BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:13px;}

  /* ── 로그인 화면 ───────────────────────── */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),var(--navy2));}
  .login-card{background:#fff;border-radius:16px;padding:40px 36px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-logo{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:4px;}
  .login-logo span{color:var(--gold);}
  .login-sub{font-size:12px;color:var(--text3);margin-bottom:24px;}
  .login-card label{display:block;font-size:12px;color:var(--text2);margin:14px 0 6px;}
  .login-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;}
  .login-card button{width:100%;margin-top:22px;padding:11px;border:none;border-radius:8px;background:var(--gold);color:#fff;font-weight:700;font-size:14px;}
  .login-card button:hover{background:var(--gold-dark);}
  .login-error{margin-top:12px;font-size:12px;color:var(--red);min-height:14px;}

  /* ── 레이아웃 ───────────────────────── */
  #app{display:none;}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--navy);color:#cdd6e6;padding:20px 0;overflow-y:auto;}
  .sb-logo{padding:0 20px 20px;font-size:18px;font-weight:800;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .sb-logo span{color:var(--gold);}
  .sb-group{padding:14px 20px 6px;font-size:10.5px;letter-spacing:.06em;color:#7688a8;text-transform:uppercase;}
  .sb-item{display:flex;align-items:center;gap:8px;padding:9px 20px;font-size:13.5px;color:#cdd6e6;cursor:pointer;border-left:3px solid transparent;}
  .sb-item:hover{background:rgba(255,255,255,.06);}
  .sb-item.active{background:rgba(184,145,47,.16);border-left-color:var(--gold);color:#fff;font-weight:600;}

  #content{margin-left:220px;min-height:100vh;}
  #topbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 26px;display:flex;justify-content:space-between;align-items:center;z-index:5;}
  #topbar .title{font-size:16px;font-weight:700;}
  #topbar .who{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:10px;}
  #topbar .who b{color:var(--text);}
  #topbar .logout{color:var(--red);cursor:pointer;font-size:12.5px;}
  #main{padding:22px 26px 60px;}

  /* ── 공통 컴포넌트 ───────────────────────── */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;border-top:3px solid var(--gold);}
  .kpi .n{font-size:22px;font-weight:800;}
  .kpi .l{font-size:12px;color:var(--text2);margin-top:2px;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .panel-head h2{font-size:15px;margin:0;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;}

  .btn{padding:7px 13px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--text);}
  .btn:hover{background:#f4f4f4;}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn.primary:hover{background:var(--gold-dark);}
  .btn.danger{color:var(--red);border-color:rgba(220,53,69,.3);}
  .btn.danger:hover{background:rgba(220,53,69,.08);}
  .btn.small{padding:4px 9px;font-size:11.5px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  table.dt{width:100%;border-collapse:collapse;font-size:12.8px;}
  table.dt th{text-align:left;padding:9px 10px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;}
  table.dt td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.dt tr:hover td{background:#faf9f6;}
  .dt-wrap{overflow-x:auto;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.gray{background:#eef0f3;color:var(--text2);}
  .badge.green{background:rgba(15,157,104,.12);color:var(--green);}
  .badge.amber{background:rgba(181,106,0,.12);color:var(--amber);}
  .badge.red{background:rgba(220,53,69,.12);color:var(--red);}
  .badge.blue{background:rgba(47,111,224,.12);color:var(--blue);}
  .badge.gold{background:rgba(184,145,47,.14);color:var(--gold-dark);}

  .empty{padding:30px;text-align:center;color:var(--text3);font-size:13px;}
  .hint{font-size:11.5px;color:var(--text3);margin-top:6px;line-height:1.5;}

  /* ── 모달 ───────────────────────── */
  #modalOverlay{position:fixed;inset:0;background:rgba(10,14,24,.5);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:22px 24px;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .modal .field{margin-bottom:12px;}
  .modal .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
  .modal .field input,.modal .field select,.modal .field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;}
  .modal .field textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:220px;}
  .modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .modal-err{color:var(--red);font-size:12px;margin-top:8px;min-height:14px;}

  /* ── 토스트 ───────────────────────── */
  #toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:80;max-width:320px;}

  @media (max-width:860px){
    #sidebar{display:none;}
    #content{margin-left:0;}
  }
</style>
</head>
<body>

<!-- ══════════════ 로그인 화면 ══════════════ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">콕<span>패스</span> 관리자</div>
    <div class="login-sub">직원 계정으로 로그인하세요</div>
    <label>이메일</label>
    <input type="email" id="loginEmail" autocomplete="username" placeholder="you@kokpass.co.kr">
    <label>비밀번호</label>
    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
    <button id="loginBtn">로그인</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ══════════════ 메인 앱 ══════════════ -->
<div id="app">
  <div id="sidebar">
    <div class="sb-logo">콕<span>패스</span></div>
    <div class="sb-group">현황</div>
    <div class="sb-item" data-tab="dashboard">대시보드</div>
    <div class="sb-group">판매</div>
    <div class="sb-item" data-tab="products">상품 관리</div>
    <div class="sb-item" data-tab="channels">채널(폐쇄몰) 관리</div>
    <div class="sb-item" data-tab="orders">주문 관리</div>
    <div class="sb-item" data-tab="inventory">재고(PIN) 관리</div>
    <div class="sb-item" data-tab="venues">업장 관리</div>
    <div class="sb-group">정산</div>
    <div class="sb-item" data-tab="settlements">정산</div>
    <div class="sb-group">회원</div>
    <div class="sb-item" data-tab="members">회원 목록</div>
    <div class="sb-group">설정</div>
    <div class="sb-item" data-tab="myaccount">내 계정</div>
    <div class="sb-item" id="staffNavItem" data-tab="staff">관리자 계정 관리</div>
  </div>

  <div id="content">
    <div id="topbar">
      <div class="title" id="pageTitle">대시보드</div>
      <div class="who">
        <span><b id="whoName">-</b> · <span id="whoRole">-</span></span>
        <span class="logout" id="logoutBtn">로그아웃</span>
      </div>
    </div>
    <div id="main"></div>
  </div>
</div>

<div id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
"use strict";

/* ════════════════════════════════════════════════════════════
   설정 — 콕패스 전용 Supabase 프로젝트(okdahyvqhbqvfpvtpcip)
   ════════════════════════════════════════════════════════════ */
const SB_URL = "https://okdahyvqhbqvfpvtpcip.supabase.co";
const SB_ANON_KEY = "sb_publishable_or8TBFpfxdJFC4MbC3PLrg_adM9L9h3";
const SESSION_KEY = "kp_admin_session";

let session = null;      // {access_token, refresh_token, expires_at, user}
let me = null;            // {id, name, role}

/* ── 세션 저장/복원 ─────────────────────────────────────── */
function saveSession(){ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }
function loadSession(){
  try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
  catch { return null; }
}
function clearSession(){ session = null; me = null; localStorage.removeItem(SESSION_KEY); }

/* ── 저수준 fetch 헬퍼 ─────────────────────────────────────
   REST(PostgREST)·Auth(GoTrue)·Edge Function 세 종류 엔드포인트를
   전부 이걸로 호출한다. 401을 만나면 refresh_token으로 한 번만
   재시도한다. */
async function sbFetch(path, { method = "GET", body, headers = {}, useAuth = true, retry = true } = {}) {
  const h = { apikey: SB_ANON_KEY, "Content-Type": "application/json", ...headers };
  if (useAuth && session) h.Authorization = "Bearer " + session.access_token;
  else if (!useAuth) h.Authorization = "Bearer " + SB_ANON_KEY;

  const res = await fetch(SB_URL + path, { method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined });

  if (res.status === 401 && useAuth && retry && session?.refresh_token) {
    const refreshed = await tryRefresh();
    if (refreshed) return sbFetch(path, { method, body, headers, useAuth, retry: false });
  }
  return res;
}

async function tryRefresh() {
  try {
    const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: SB_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) return false;
    const data = await res.json();
    session = { access_token: data.access_token, refresh_token: data.refresh_token,
                expires_at: Math.floor(Date.now() / 1000) + data.expires_in, user: data.user };
    saveSession();
    return true;
  } catch { return false; }
}

/* PostgREST 편의 함수 */
async function restGet(table, query = "") {
  const res = await sbFetch(`/rest/v1/${table}${query}`);
  if (!res.ok) throw new Error(await extractErr(res));
  return res.json();
}
async function restCount(table, query = "") {
  const res = await sbFetch(`/rest/v1/${table}${query}${query.includes("?") ? "&" : "?"}select=id`, {
    headers: { Prefer: "count=exact", Range: "0-0" },
  });
  if (!res.ok) return null;
  const cr = res.headers.get("content-range"); // "0-0/123"
  return cr ? parseInt(cr.split("/")[1], 10) : null;
}
async function restInsert(table, rows) {
  const res = await sbFetch(`/rest/v1/${table}`, { method: "POST", body: rows, headers: { Prefer: "return=representation" } });
  if (!res.ok) throw new Error(await extractErr(res));
  return res.json();
}
async function restPatch(table, filterQuery, patchObj) {
  const res = await sbFetch(`/rest/v1/${table}?${filterQuery}`, { method: "PATCH", body: patchObj, headers: { Prefer: "return=representation" } });
  if (!res.ok) throw new Error(await extractErr(res));
  return res.json();
}
async function restDelete(table, filterQuery) {
  const res = await sbFetch(`/rest/v1/${table}?${filterQuery}`, { method: "DELETE" });
  if (!res.ok) throw new Error(await extractErr(res));
  return true;
}
async function extractErr(res) {
  try { const j = await res.json(); return j.message || j.msg || j.error_description || JSON.stringify(j); }
  catch { return `요청 실패 (HTTP ${res.status})`; }
}
/* 삭제 실패 시 외래키 참조(FK) 위반 메시지를 그대로 보여주지 않고 알기 쉬운 안내로 바꿔준다.
   예: 이미 주문/재고/노출상품에서 참조 중인 상품·채널을 삭제하려는 경우. */
function friendlyDeleteError(e, label) {
  const msg = e && e.message ? e.message : String(e);
  if (/foreign key|violates.*constraint|is still referenced/i.test(msg)) {
    return `이 ${label}은(는) 이미 다른 데이터(주문/재고/노출상품 등)에서 참조하고 있어 삭제할 수 없습니다. 삭제 대신 "노출/활성"을 꺼서 비활성화하는 걸 권장합니다.`;
  }
  return msg;
}

/* ════════════════════════════════════════════════════════════
   로그인 / 로그아웃
   ════════════════════════════════════════════════════════════ */
document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("loginPassword").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";
  if (!email || !password) { errEl.textContent = "이메일과 비밀번호를 입력하세요."; return; }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "로그인 중...";
  try {
    const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SB_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "로그인에 실패했습니다.");

    session = { access_token: data.access_token, refresh_token: data.refresh_token,
                expires_at: Math.floor(Date.now() / 1000) + data.expires_in, user: data.user };
    saveSession();
    await afterLogin();
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "로그인";
  }
}

async function afterLogin() {
  // 로그인한 사용자가 staff 테이블에 등록된 활성 계정인지 확인 (RLS: 본인 행은 항상 조회 가능)
  const rows = await restGet("staff", `?id=eq.${session.user.id}&select=id,name,role,active`);
  const staffRow = rows[0];
  if (!staffRow || !staffRow.active) {
    clearSession();
    document.getElementById("loginError").textContent = "관리자 계정이 아니거나 비활성화된 계정입니다.";
    return;
  }
  me = staffRow;
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("whoName").textContent = me.name;
  document.getElementById("whoRole").textContent = me.role === "admin" ? "관리자" : "스태프";
  document.getElementById("staffNavItem").style.display = me.role === "admin" ? "flex" : "none";
  goTab("dashboard");
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try { await sbFetch("/auth/v1/logout", { method: "POST" }); } catch {}
  clearSession();
  location.reload();
});

/* 30분마다 세션 만료 임박 시 미리 갱신 */
setInterval(() => {
  if (session && session.expires_at - Math.floor(Date.now() / 1000) < 300) tryRefresh();
}, 4 * 60 * 1000);

/* ════════════════════════════════════════════════════════════
   탭 네비게이션
   ════════════════════════════════════════════════════════════ */
const TAB_TITLES = {
  dashboard: "대시보드", products: "상품 관리", channels: "채널(폐쇄몰) 관리",
  orders: "주문 관리", inventory: "재고(PIN) 관리", venues: "업장 관리",
  settlements: "정산", members: "회원 목록",
  myaccount: "내 계정", staff: "관리자 계정 관리",
};
const TAB_RENDERERS = {
  dashboard: renderDashboard, products: renderProducts, channels: renderChannels,
  orders: renderOrders, inventory: renderInventory, venues: renderVenues,
  settlements: renderSettlements, members: renderMembers,
  myaccount: renderMyAccount, staff: renderStaff,
};

document.querySelectorAll(".sb-item").forEach(el => el.addEventListener("click", () => goTab(el.dataset.tab)));

function goTab(tab) {
  document.querySelectorAll(".sb-item").forEach(el => el.classList.toggle("active", el.dataset.tab === tab));
  document.getElementById("pageTitle").textContent = TAB_TITLES[tab] || tab;
  const main = document.getElementById("main");
  main.innerHTML = `<div class="empty">불러오는 중...</div>`;
  (TAB_RENDERERS[tab] || (() => { main.innerHTML = `<div class="empty">준비 중입니다.</div>`; }))();
}

/* ════════════════════════════════════════════════════════════
   공통 UI 헬퍼
   ════════════════════════════════════════════════════════════ */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtWon(n) { return n == null ? "-" : Number(n).toLocaleString("ko-KR") + "원"; }
function fmtDate(s) { if (!s) return "-"; return String(s).replace("T", " ").slice(0, 16); }

function toast(msg, isErr = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = isErr ? "var(--red)" : "var(--navy)";
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = "none"; }, 3200);
}

function dtTable(headers, rowsHtml) {
  return `<div class="dt-wrap"><table class="dt"><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rowsHtml.length ? rowsHtml.join("") : `<tr><td colspan="${headers.length}"><div class="empty">데이터가 없습니다.</div></td></tr>`}</tbody></table></div>`;
}

function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalOverlay").style.display = "flex";
}
function closeModal() { document.getElementById("modalOverlay").style.display = "none"; }
document.getElementById("modalOverlay").addEventListener("click", e => { if (e.target.id === "modalOverlay") closeModal(); });

/* row(JSON 오브젝트)를 그대로 편집하는 범용 모달 — 세부 폼 대신 사용하는
   "실무자용" 편집 방식. 스키마 그대로 노출되므로 정확하고 빠르게 확장 가능. */
function openJsonEditModal({ title, table, pkCol, initial, onSaved, filterQuery, isInsert }) {
  const editable = { ...initial };
  delete editable.created_at; delete editable.updated_at;
  if (!isInsert) delete editable[pkCol];
  const json = JSON.stringify(editable, null, 2);
  openModal(`
    <h3>${esc(title)}</h3>
    <div class="field">
      <label>${isInsert ? "새 레코드 (JSON)" : `필드 편집 (JSON, ${pkCol} 제외)`}</label>
      <textarea id="jsonEditArea">${esc(json)}</textarea>
    </div>
    <div class="modal-err" id="jsonEditErr"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" id="jsonEditSaveBtn">저장</button>
    </div>
  `);
  document.getElementById("jsonEditSaveBtn").addEventListener("click", async () => {
    const errEl = document.getElementById("jsonEditErr");
    let parsed;
    try { parsed = JSON.parse(document.getElementById("jsonEditArea").value); }
    catch { errEl.textContent = "JSON 형식이 올바르지 않습니다."; return; }
    try {
      if (isInsert) await restInsert(table, [parsed]);
      else await restPatch(table, filterQuery, parsed);
      closeModal();
      toast("저장했습니다.");
      onSaved && onSaved();
    } catch (e) { errEl.textContent = e.message; }
  });
}

function statusBadge(status) {
  const map = { paid: ["green", "결제완료"], pending: ["amber", "대기중"], refunded: ["red", "환불"], cancelled: ["gray", "취소"], failed: ["red", "실패"],
                available: ["green", "판매가능"], sold: ["blue", "판매완료"], used: ["gold", "사용완료"] };
  const [cls, label] = map[status] || ["gray", status || "-"];
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

/* ════════════════════════════════════════════════════════════
   2. 상품 관리 — 더블에이치(HHCOMPANY) admin의 상품관리 화면(2026-08 기준)
   구조를 콕패스 스키마(products에 group_dates 없음)에 맞춰 그대로 이식.
   추가/수정은 폼으로, 순서변경(▲▼⇈⇊)·노출/개인판매 토글·삭제까지 지원한다.

   ════════════════════════════════════════════════════════════ */
let PRODUCTS_CACHE = [];
let prodTicketRowCount = 0;

function boolBadge(v) { return v ? `<span class="badge green">ON</span>` : `<span class="badge gray">OFF</span>`; }

async function renderProducts() {

async function loadProductsTable() {
  const wrap = document.getElementById("productsTableWrap");

    wrap.innerHTML = dtTable(["순서", "ID", "상품명", "가격", "개인판매", "노출", "핫딜", "액션"], rows.map((p, i) => {
      const isFirst = i === 0, isLast = i === rows.length - 1;
      return `<tr>
        <td>
          <div style="display:flex;gap:2px">
            <button class="btn small" style="padding:2px 6px;${isFirst ? "opacity:.35;cursor:default" : ""}" ${isFirst ? "disabled" : ""} data-act="move" data-id="${esc(p.id)}" data-dir="top" title="맨 위로">⇈</button>
            <button class="btn small" style="padding:2px 6px;${isFirst ? "opacity:.35;cursor:default" : ""}" ${isFirst ? "disabled" : ""} data-act="move" data-id="${esc(p.id)}" data-dir="-1" title="한 칸 위로">▲</button>

            <button class="btn small" style="padding:2px 6px;${isLast ? "opacity:.35;cursor:default" : ""}" ${isLast ? "disabled" : ""} data-act="move" data-id="${esc(p.id)}" data-dir="bottom" title="맨 아래로">⇊</button>
          </div>
        </td>
        <td>${esc(p.id)}</td>
        <td>${esc(p.emoji || "")} ${esc(p.name)}</td>
        <td>${fmtWon(p.indiv_price)}</td>
        <td><button class="btn small" data-act="toggle-sale" data-id="${esc(p.id)}" data-val="${!p.indiv_sale_enabled}">${boolBadge(p.indiv_sale_enabled)}</button></td>

        <td>${boolBadge(p.hot)}</td>
        <td>
          <button class="btn small" data-act="edit" data-id="${esc(p.id)}">편집</button>
          ${me.role === "admin" ? `<button class="btn small danger" data-act="del" data-id="${esc(p.id)}">삭제</button>` : ""}
        </td>
      </tr>`;
    }));
    wrap.querySelectorAll("[data-act=toggle-sale]").forEach(b => b.addEventListener("click", async () => {
      try { await restPatch("products", `id=eq.${b.dataset.id}`, { indiv_sale_enabled: b.dataset.val === "true" }); toast("변경했습니다."); loadProductsTable(); }
      catch (e) { toast(e.message, true); }
    }));
    wrap.querySelectorAll("[data-act=toggle-visible]").forEach(b => b.addEventListener("click", async () => {
      try { await restPatch("products", `id=eq.${b.dataset.id}`, { visible: b.dataset.val === "true" }); toast("변경했습니다."); loadProductsTable(); }
      catch (e) { toast(e.message, true); }
    }));
    wrap.querySelectorAll("[data-act=edit]").forEach(b => b.addEventListener("click", () => openProductModal(b.dataset.id)));
    wrap.querySelectorAll("[data-act=del]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("이 상품을 영구 삭제할까요? 되돌릴 수 없습니다.\n(이미 주문/재고/노출상품에서 참조 중이면 삭제가 거부됩니다 — 그럴 땐 '노출' 또는 '개인판매'를 꺼서 비활성화하세요.)")) return;
      try { await restDelete("products", `id=eq.${b.dataset.id}`); toast("삭제했습니다."); loadProductsTable(); }
      catch (e) { toast(friendlyDeleteError(e, "상품"), true); }
    }));
    wrap.querySelectorAll("[data-act=move]").forEach(b => b.addEventListener("click", () => {
      const { id, dir } = b.dataset;
      if (dir === "top" || dir === "bottom") moveProductToEdge(id, dir);
      else moveProductOrder(id, Number(dir));
    }));
  } catch (e) { wrap.innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message)}</div>`; }
}

async function moveProductOrder(id, dir) {
  const idx = PRODUCTS_CACHE.findIndex(p => p.id === id);
  if (idx === -1) return;
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= PRODUCTS_CACHE.length) return;
  const a = PRODUCTS_CACHE[idx], b = PRODUCTS_CACHE[swapIdx];
  const aOrder = a.sort_order, bOrder = b.sort_order;
  try {
    await Promise.all([
      restPatch("products", `id=eq.${a.id}`, { sort_order: bOrder }),
      restPatch("products", `id=eq.${b.id}`, { sort_order: aOrder }),
    ]);
    loadProductsTable();
  } catch (e) { toast("순서 변경 실패: " + e.message, true); }
}

async function moveProductToEdge(id, edge) {
  const idx = PRODUCTS_CACHE.findIndex(p => p.id === id);
  if (idx === -1) return;
  if ((edge === "top" && idx === 0) || (edge === "bottom" && idx === PRODUCTS_CACHE.length - 1)) return;
  const rows = [...PRODUCTS_CACHE];
  const [item] = rows.splice(idx, 1);
  if (edge === "top") rows.unshift(item); else rows.push(item);
  rows.forEach((p, i) => { p.sort_order = i * 10; });
  try {
    await Promise.all(rows.map(p => restPatch("products", `id=eq.${p.id}`, { sort_order: p.sort_order })));
    toast("순서를 저장했습니다.");
    loadProductsTable();
  } catch (e) { toast("순서 변경 실패: " + e.message, true); }
}

    <input type="number" placeholder="단가" id="pt-price-${i}" value="${pr != null ? pr : ""}" style="width:110px;padding:8px 10px;border:1px solid var(--border);border-radius:7px">
    <button class="btn small danger" type="button" onclick="this.parentElement.remove()">×</button>`;
  container.appendChild(div);
}

      </div>
      <div class="field" style="flex:1"><label>핫딜</label>
        <select id="pf-hot"><option value="false" ${!p?.hot ? "selected" : ""}>아니오</option><option value="true" ${p?.hot ? "selected" : ""}>예</option></select>
      </div>
    </div>
    <div style="display:flex;gap:12px">
      <div class="field" style="flex:1"><label>개인판매가</label><input id="pf-indiv-price" type="number" value="${p?.indiv_price ?? ""}"></div>
      <div class="field" style="flex:1"><label>개인판매 활성화</label>
        <select id="pf-indiv-enabled"><option value="false" ${!p?.indiv_sale_enabled ? "selected" : ""}>끄기</option><option value="true" ${p?.indiv_sale_enabled ? "selected" : ""}>켜기</option></select>
      </div>
    </div>
    <div class="modal-err" id="pfErr"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="pfSaveBtn">저장</button></div>

  const rowsWrap = document.getElementById("pf-ticket-rows");
  const tickets = p?.tickets || [];
  if (tickets.length) tickets.forEach(t => addProdTicketRow(rowsWrap, t.type, t.range, t.price));
  else addProdTicketRow(rowsWrap);
  document.getElementById("pf-addTicketBtn").addEventListener("click", () => addProdTicketRow(rowsWrap));

async function saveProductForm(id) {
  const errEl = document.getElementById("pfErr");
  const name = document.getElementById("pf-name").value.trim();
  const vname = document.getElementById("pf-vname").value.trim();
  if (!name) { errEl.textContent = "상품명을 입력해주세요."; return; }
  const tickets = [];
  document.querySelectorAll("#pf-ticket-rows > div").forEach(row => {
    const inputs = row.querySelectorAll("input");
    const t = inputs[0].value.trim(), r = inputs[1].value.trim(), pr = parseInt(inputs[2].value, 10) || 0;
    if (t && pr > 0) tickets.push({ type: t, range: r, price: pr });
  });
  const indivEnabled = document.getElementById("pf-indiv-enabled").value === "true";
  const indivPriceRaw = document.getElementById("pf-indiv-price").value.trim();
  const indivPrice = indivPriceRaw ? parseInt(indivPriceRaw, 10) : null;
  if (indivEnabled && (!indivPrice || indivPrice <= 0)) { errEl.textContent = "개인판매를 켜려면 개인판매가를 입력해주세요."; return; }
  const color = document.getElementById("pf-color").value;
  const data = {
    name, vname,
    cat: document.getElementById("pf-cat").value,
    emoji: document.getElementById("pf-emoji").value.trim() || "🎫",
    color, gradient: `linear-gradient(135deg,${color},${color}cc)`,
    tags: document.getElementById("pf-tags").value.split(",").map(t => t.trim()).filter(Boolean),
    desc: document.getElementById("pf-desc").value.trim(),
    image_url: document.getElementById("pf-image").value.trim() || null,
    features: document.getElementById("pf-features").value.split("\n").map(f => f.trim()).filter(Boolean),
    tickets,
    visible: document.getElementById("pf-visible").value === "true",
    hot: document.getElementById("pf-hot").value === "true",
    indiv_price: indivPrice,
    indiv_sale_enabled: indivEnabled,
  };
  try {
    if (id) {
      await restPatch("products", `id=eq.${id}`, data);
      toast(`'${name}' 상품을 수정했습니다.`);
    } else {
      const newId = document.getElementById("pf-id").value.trim();
      if (!newId) { errEl.textContent = "ID를 입력해주세요."; return; }
      data.id = newId;
      data.sort_order = PRODUCTS_CACHE.length * 10;
      await restInsert("products", [data]);
      toast(`'${name}' 상품을 추가했습니다.`);
    }
    closeModal();
    loadProductsTable();
  } catch (e) { errEl.textContent = e.message; }
}

function slugifyPin(pin) { return "pin_" + String(pin).toLowerCase().replace(/[^a-z0-9]/g, ""); }

async function handleCsvUpload(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const text = await file.text();
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines) {
    const [venue_name, coupon_type, ticket_name, pin_number, valid_from, valid_to, price] = line.split(",").map(s => (s || "").trim());
    if (!pin_number) continue;
    rows.push({ id: slugifyPin(pin_number), venue_name, coupon_type, ticket_name, pin_number, valid_from: valid_from || null, valid_to: valid_to || null, price: price ? Number(price) : 0, status: "available" });
  }
  if (!rows.length) { toast("유효한 행이 없습니다.", true); return; }
  if (!confirm(`${rows.length}건을 등록합니다. 계속할까요?`)) return;
  try {
    await restInsert("pin_inventory", rows);
    toast(`${rows.length}건 등록 완료.`);
    loadInventoryTable();
  } catch (err) { toast("등록 실패: " + err.message, true); }
}

async function calcSettlementPreview() {
  const from = document.getElementById("stFrom").value;
  const to = document.getElementById("stTo").value;
  const scope = document.getElementById("stScope").value;
  const wrap = document.getElementById("stPreviewWrap");
  if (!from || !to) { toast("시작일/종료일을 입력하세요.", true); return; }
  wrap.innerHTML = `<div class="empty">집계 중...</div>`;
  try {
    const fromTs = `${from}T00:00:00`, toTs = `${to}T23:59:59`;
    const [orders, pins] = await Promise.all([
      restGet("orders", `?status=eq.paid&paid_at=gte.${fromTs}&paid_at=lte.${toTs}&select=venue_name,channel_id,total_amount`),
      scope === "venue"
        ? restGet("pin_inventory", `?refunded_at=gte.${fromTs}&refunded_at=lte.${toTs}&select=venue_name,refund_amount`)
        : Promise.resolve([]),
    ]);

    const keyOf = o => scope === "venue" ? (o.venue_name || "(업장 미지정)") : (o.channel_id || "직접판매");
    const groups = {};
    for (const o of orders) {
      const k = keyOf(o);
      groups[k] = groups[k] || { count: 0, gross: 0, refund: 0 };
      groups[k].count++; groups[k].gross += (o.total_amount || 0);
    }
    for (const p of pins) {
      const k = p.venue_name || "(업장 미지정)";
      groups[k] = groups[k] || { count: 0, gross: 0, refund: 0 };
      groups[k].refund += Number(p.refund_amount || 0);
    }

    const keys = Object.keys(groups);
    if (!keys.length) { wrap.innerHTML = `<div class="empty">해당 기간에 결제완료 주문이 없습니다.</div>`; return; }

    const rates = {};
    try {
      if (scope === "venue") {
        const inList = keys.map(k => `"${encodeURIComponent(k)}"`).join(",");
        const vb = await restGet("venue_billing", `?venue_name=in.(${inList})&select=venue_name,payout_rate`);
        vb.forEach(r => { rates[decodeURIComponent(r.venue_name)] = Number(r.payout_rate || 0); });
      } else {
        const inList = keys.map(k => `"${encodeURIComponent(k)}"`).join(",");
        const cb = await restGet("channel_billing", `?channel_id=in.(${inList})&select=channel_id,fee`);
        cb.forEach(r => { rates[decodeURIComponent(r.channel_id)] = Number(r.fee || 0); });
      }
    } catch { /* 정산정보 테이블 접근 실패(권한 등) 시 정산율 0으로 진행 */ }

    stPreviewRows = keys.map(k => {
      const g = groups[k];
      const net = g.gross - g.refund;
      const rate = rates[k] ?? 0;
      return {
        scope_type: scope, scope_key: k, period_start: from, period_end: to,
        order_count: g.count, gross_amount: g.gross, refund_amount: g.refund,
        net_amount: net, rate, payout_amount: Math.round(net * rate),
      };
    });
    renderStPreviewTable(wrap);
  } catch (e) { wrap.innerHTML = `<div class="empty">집계 실패: ${esc(e.message)}</div>`; }
}

function renderStPreviewTable(wrap) {
  wrap.innerHTML = `
    ${dtTable(["대상", "건수", "총매출", "환불액", "순매출", "정산율", "지급액", "정산율 수정"], stPreviewRows.map((r, i) => `
      <tr>
        <td>${esc(r.scope_key)}</td><td>${r.order_count}</td><td>${fmtWon(r.gross_amount)}</td>
        <td>${fmtWon(r.refund_amount)}</td><td>${fmtWon(r.net_amount)}</td>
        <td>${(r.rate * 100).toFixed(1)}%</td><td id="stPayout${i}">${fmtWon(r.payout_amount)}</td>
        <td><input type="number" step="0.01" min="0" max="1" data-rate-idx="${i}" value="${r.rate}" style="width:70px"></td>
      </tr>`))}
    <div class="modal-actions" style="justify-content:flex-start;margin-top:10px">
      <button class="btn primary" id="stSaveDraftBtn">이 결과를 정산 내역에 초안으로 저장</button>
    </div>
    <div class="hint">정산율(예: 0.7 = 70%)을 표에서 직접 고쳐 다시 계산할 수 있습니다. 저장 전까지는 DB에 아무것도 기록되지 않습니다.</div>
  `;
  wrap.querySelectorAll("[data-rate-idx]").forEach(inp => inp.addEventListener("change", () => {
    const i = Number(inp.dataset.rateIdx);
    stPreviewRows[i].rate = Number(inp.value) || 0;
    stPreviewRows[i].payout_amount = Math.round(stPreviewRows[i].net_amount * stPreviewRows[i].rate);
    document.getElementById(`stPayout${i}`).textContent = fmtWon(stPreviewRows[i].payout_amount);
  }));
  document.getElementById("stSaveDraftBtn").addEventListener("click", saveSettlementDrafts);
}

async function saveSettlementDrafts() {
  if (!stPreviewRows.length) return;
  if (!confirm(`${stPreviewRows.length}건을 정산 내역에 "초안" 상태로 저장합니다. 계속할까요?`)) return;
  try {
    const rows = stPreviewRows.map(r => ({
      scope_type: r.scope_type, scope_key: r.scope_key,
      period_start: r.period_start, period_end: r.period_end,
      order_count: r.order_count, gross_amount: r.gross_amount, refund_amount: r.refund_amount,
      net_amount: r.net_amount, rate: r.rate, payout_amount: r.payout_amount,
      status: "draft", created_by: me.id,
    }));
    await restInsert("settlements", rows);
    toast("정산 내역에 초안으로 저장했습니다.");
    loadSettlementHistory();
  } catch (e) { toast("저장 실패: " + e.message, true); }
}

async function loadSettlementHistory() {
  const wrap = document.getElementById("stHistWrap");
  if (!wrap) return;
  stHistFilter.scope = document.getElementById("stHistScope")?.value || "";
  stHistFilter.status = document.getElementById("stHistStatus")?.value || "";
  try {
    let query = "?select=*&order=period_start.desc,scope_key.asc&limit=300";
    if (stHistFilter.scope) query += `&scope_type=eq.${stHistFilter.scope}`;
    if (stHistFilter.status) query += `&status=eq.${stHistFilter.status}`;
    const rows = await restGet("settlements", query);
    wrap.innerHTML = dtTable(["기간", "구분", "대상", "건수", "순매출", "정산율", "지급액", "상태", "액션"], rows.map(r => `
      <tr>
        <td>${esc(r.period_start)} ~ ${esc(r.period_end)}</td>
        <td>${r.scope_type === "venue" ? "업장" : "채널"}</td><td>${esc(r.scope_key)}</td>
        <td>${r.order_count}</td><td>${fmtWon(r.net_amount)}</td><td>${(Number(r.rate) * 100).toFixed(1)}%</td>
        <td>${fmtWon(r.payout_amount)}</td><td>${settlementStatusBadge(r.status)}</td>
        <td>
          ${r.status === "draft" ? `<button class="btn small" data-act="confirm" data-id="${r.id}">확정</button>` : ""}
          ${r.status === "confirmed" ? `<button class="btn small" data-act="paid" data-id="${r.id}">지급완료 처리</button>` : ""}
          ${me.role === "admin" ? `<button class="btn small danger" data-act="del" data-id="${r.id}">삭제</button>` : ""}
        </td>
      </tr>`));
    wrap.querySelectorAll("[data-act=confirm]").forEach(b => b.addEventListener("click", async () => {
      try { await restPatch("settlements", `id=eq.${b.dataset.id}`, { status: "confirmed", confirmed_at: new Date().toISOString() }); toast("확정했습니다."); loadSettlementHistory(); }
      catch (e) { toast(e.message, true); }
    }));
    wrap.querySelectorAll("[data-act=paid]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("지급 완료로 표시할까요? 실제 송금은 별도로 진행해야 합니다(이 버튼은 기록용입니다).")) return;
      try { await restPatch("settlements", `id=eq.${b.dataset.id}`, { status: "paid", paid_at: new Date().toISOString() }); toast("지급완료로 표시했습니다."); loadSettlementHistory(); }
      catch (e) { toast(e.message, true); }
    }));
    wrap.querySelectorAll("[data-act=del]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("이 정산 내역을 삭제할까요? 되돌릴 수 없습니다.")) return;
      try { await restDelete("settlements", `id=eq.${b.dataset.id}`); toast("삭제했습니다."); loadSettlementHistory(); }
      catch (e) { toast(friendlyDeleteError(e, "정산 내역"), true); }
    }));
  } catch (e) { wrap.innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message)}</div>`; }
}

function settlementStatusBadge(s) {
  const map = { draft: ["gray", "초안"], confirmed: ["blue", "확정"], paid: ["green", "지급완료"] };
  const [cls, label] = map[s] || ["gray", s || "-"];
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

async function exportSettlementsCsv() {
  try {
    let query = "?select=*&order=period_start.desc,scope_key.asc&limit=2000";
    if (stHistFilter.scope) query += `&scope_type=eq.${stHistFilter.scope}`;
    if (stHistFilter.status) query += `&status=eq.${stHistFilter.status}`;
    const rows = await restGet("settlements", query);
    if (!rows.length) { toast("내보낼 데이터가 없습니다.", true); return; }
    const headers = ["기간시작", "기간종료", "구분", "대상", "건수", "총매출", "환불액", "순매출", "정산율", "지급액", "상태", "확정일시", "지급일시"];
    const lines = [headers.join(",")];
    for (const r of rows) {
      lines.push([
        r.period_start, r.period_end, r.scope_type, r.scope_key, r.order_count,
        r.gross_amount, r.refund_amount, r.net_amount, r.rate, r.payout_amount,
        r.status, r.confirmed_at || "", r.paid_at || "",
      ].map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(","));
    }
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `콕패스_정산내역_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch (e) { toast("내보내기 실패: " + e.message, true); }
}

async function callAdminStaffApi(payload) {

  if (!res.ok) throw new Error(data.message || "요청 실패");
  return data;
}

}

/* ════════════════════════════════════════════════════════════
   부팅 — 저장된 세션이 있으면 자동 로그인 시도
   ════════════════════════════════════════════════════════════ */
(async function boot() {
  const saved = loadSession();
  if (!saved) return;
  session = saved;
  if (session.expires_at - Math.floor(Date.now() / 1000) < 60) {
    const ok = await tryRefresh();
    if (!ok) { clearSession(); return; }
  }
  await afterLogin();
})();
</script>
